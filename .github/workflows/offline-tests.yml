name: Offline tests
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -X utf8 -m unittest discover -s tests -v
